apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
spec:
  template:
    spec:
      securityContext:
        # OpenShift assigns namespace-appropriate IDs through its SCC.
        runAsUser: null
        fsGroup: null
      containers:
        - name: sealed-secrets-controller
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

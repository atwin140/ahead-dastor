apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: acme-godaddy-letsencrypt
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  acme:
    email: mmullaly@dastorllc.com
    privateKeySecretRef:
      name: godaddy-acme-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        webhook:
          config:
            apiTokenSecretRef:
              key: token
              name: godaddy-dns-credentials
          groupName: acme.godaddy.com
          solverName: godaddy

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgresql-backup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: powerstore-fc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-postgresql-backup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: pg-backup
            image: registry.redhat.io/rhel9/postgresql-15:latest
            command:
            - /bin/bash
            - -ec
            - 'umask 077

              file="/backup/keycloak-$(date +%Y%m%d-%H%M%S).sql"

              trap ''rm -f "${file}.partial"'' EXIT

              pg_dump -h keycloak-postgresql -U "$PGUSER" -d "$PGDATABASE" --clean
              --if-exists > "${file}.partial"

              mv "${file}.partial" "$file"

              find /backup -name ''keycloak-*.sql'' -mtime +30 -delete

              echo "Database backup completed"

              '
            env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: password
            - name: PGDATABASE
              value: keycloak
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: keycloak-postgresql-backup
          serviceAccountName: keycloak-postgresql
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      backoffLimit: 2
  timeZone: America/Chicago
  startingDeadlineSeconds: 3600

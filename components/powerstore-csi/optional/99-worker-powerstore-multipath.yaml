# Review before applying: replaces /etc/multipath.conf on worker nodes.
# MachineConfig rollout can drain and reboot nodes.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-worker-powerstore-multipath
  labels:
    machineconfiguration.openshift.io/role: worker
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
        - path: /etc/multipath.conf
          mode: 420
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: multipathd.service
          enabled: true

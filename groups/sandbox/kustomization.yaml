apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- devspaces-instance.yaml
- devspaces-operator.yaml

patches:
# Matches every Application in this kustomization (no name selector), so new
# apps added to resources above automatically get targetRevision: sandbox.
- target:
    group: argoproj.io
    version: v1alpha1
    kind: Application
  patch: |-
    - op: replace
      path: /spec/source/targetRevision
      value: sandbox

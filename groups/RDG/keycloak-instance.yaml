apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dastor-keycloak
  namespace: openshift-gitops
spec:
  project: platform-services
  source:
    repoURL: https://github.com/atwin140/ahead-dastor.git
    targetRevision: sandbox
    path: components/keycloak-operator/overlays/dastor
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
